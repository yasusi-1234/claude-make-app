name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test

      # next build が内部でTypeScriptの型チェックも行うため、
      # 個別の `tsc --noEmit` ステップは不要(かつ .next/types 生成前は失敗する)
      - run: npm run build
